# Keeps dependencies and CI actions current. Updates arrive as pull requests that must pass the
# `ci` check before merging; nothing here changes production by itself.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @astrojs/check (used by `npm run check`) only supports TypeScript 5 and 6, so a TypeScript 7 bump
      # fails `npm ci`. Remove this once @astrojs/check declares TypeScript 7 support.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
